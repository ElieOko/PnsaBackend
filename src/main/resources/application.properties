spring.application.name=pnsa
server.port=8029
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.datasource.driver-class-name=org.postgresql.Driver
#R2DBC
spring.r2dbc.url=${SUPABASE_REACTIVE_URL:r2dbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.r2dbc.initialization-mode=always
spring.r2dbc.username=${USERNAME:postgres}
spring.r2dbc.password=${PASSWORD:postgres}
# flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${FLYWAY_URL:jdbc:postgresql://localhost:5432/postgres}
spring.flyway.locations=classpath:/db/migration

# CSV seed
app.seed.structures.enabled=false
app.seed.structures.resource=classpath:data/structures.csv
app.seed.structures.default-pin=1234